
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empresa | Conecta Jovem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">Conecta Jovem</a>
        </div>
    </header>

    <main class="auth-section">
        <form class="auth-form" aria-labelledby="cadastro-empresa-titulo">
            <h1 id="cadastro-empresa-titulo">Cadastro de Empresa</h1>

            <label for="nome-empresa">Nome da empresa</label>
            <input type="text" id="nome-empresa" name="nome-empresa"
                   autocomplete="organization" required>

            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" name="cnpj"
                   placeholder="00.000.000/0000-00" required>

            <label for="responsavel">Nome do responsável</label>
            <input type="text" id="responsavel" name="responsavel"
                   autocomplete="name" required>

            <label for="email">E-mail corporativo</label>
            <input type="email" id="email" name="email"
                   autocomplete="email" required>

            <label for="telefone">Telefone de contato</label>
            <input type="tel" id="telefone" name="telefone"
                   autocomplete="tel" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha"
                   minlength="8" autocomplete="new-password" required>

            <label for="confirmar-senha">Confirmar senha</label>
            <input type="password" id="confirmar-senha"
                   name="confirmar-senha"
                   minlength="8" autocomplete="new-password" required>

            <button type="submit" class="register-button">
                Solicitar cadastro
            </button>

            <p>Já tem conta? <a href="login.html">Entrar</a></p>
            <p><a href="cadastro.html">Voltar à escolha de cadastro</a></p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
