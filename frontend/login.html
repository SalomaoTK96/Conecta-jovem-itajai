
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Conecta Jovem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">

            <a href="index.html" class="logo" aria-label="Conecta Jovem - Início">
                <span class="logo-mark" aria-hidden="true">CJ</span>
                <span>Conecta <strong>Jovem</strong></span>
            </a>

            <nav class="nav" aria-label="Navegação principal">
                <a href="index.html#inicio" class="nav-link">Início</a>
                <a href="index.html#vagas" class="nav-link">Vagas</a>
                <a href="index.html#sobre" class="nav-link">Sobre</a>
            </nav>

            <div class="header-actions">

                <button
                    class="theme-button"
                    type="button"
                    aria-label="Alternar tema"
                    title="Alternar tema">
                    🌓
                </button>

                <a href="cadastro.html" class="register-button">Criar conta</a>

            </div>
        </div>
    </header>

    <main class="auth-section">
        <form class="auth-form" id="form-login" aria-labelledby="login-titulo">
            <h1 id="login-titulo">Entrar</h1>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>

            <button type="submit" class="register-button">
                Entrar
            </button>

            <!-- Onde aparece o retorno da API. role="alert" faz o leitor de
                 tela anunciar sozinho quando o texto muda. -->
            <p id="aviso" class="aviso" role="alert" hidden></p>

            <p>Não tem conta? <a href="cadastro.html">Criar conta</a></p>
        </form>
    </main>

    <footer class="footer">
        <div class="container footer-container">

            <a href="index.html" class="logo footer-logo">
                <span class="logo-mark" aria-hidden="true">CJ</span>
                <span>Conecta <strong>Jovem</strong></span>
            </a>

            <p>Conectando jovens a oportunidades de estágio e aprendizagem.</p>

            <span class="footer-copy">© 2026 Conecta Jovem</span>

        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
