<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da vaga | Conecta Jovem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">

            <a href="index.html" class="logo">
                <span class="logo-mark" aria-hidden="true">CJ</span>
                <span>Conecta <strong>Jovem</strong></span>
            </a>

            <nav class="nav" aria-label="Navegação principal">
                <a href="index.html#inicio" class="nav-link">Início</a>
                <a href="vagas.html" class="nav-link">Vagas</a>
                <a href="index.html#sobre" class="nav-link">Sobre</a>
            </nav>

            <div class="header-actions">

                <button
                    class="theme-button"
                    type="button"
                    aria-label="Alternar tema"
                    title="Alternar tema">
                    🌓
                </button>

                <a href="login.html" class="login-button">Entrar</a>
                <a href="cadastro.html" class="register-button">Criar conta</a>

            </div>
        </div>
    </header>

        <main class="auth-section">
        <section class="auth-form painel-detalhe-vaga" aria-labelledby="vaga-titulo">
            <p><a href="vagas.html" id="voltar-mural">← Voltar para as vagas</a></p>

            <article id="detalhe-vaga" hidden>
                <h1 id="vaga-titulo"></h1>
                <p class="empresa-vaga" id="vaga-empresa"></p>

                <dl class="dados-vaga">
                    <dt>Tipo</dt><dd id="vaga-tipo"></dd>
                    <dt>Área</dt><dd id="vaga-area"></dd>
                    <dt>Cidade</dt><dd id="vaga-cidade"></dd>
                    <dt>Recebe candidaturas até</dt><dd id="vaga-prazo"></dd>
                </dl>

                <h2>Descrição</h2>
                <p id="vaga-descricao" class="texto-vaga"></p>

                <div id="bloco-requisitos" hidden>
                    <h2>Requisitos</h2>
                    <p id="vaga-requisitos" class="texto-vaga"></p>
                </div>

                <!-- US10: o botão só funciona para jovem logado. Visitante é levado ao login. -->
                <div id="area-candidatura" class="area-candidatura">
                    <button type="button" id="candidatar" class="register-button" hidden>Candidatar-se</button>
                    <a href="login.html" id="entrar-para-candidatar" class="register-button" hidden>Entrar para se candidatar</a>
                    <p id="situacao-candidatura" class="situacao-candidatura" role="status" aria-live="polite" hidden></p>
                </div>
            </article>

            <p id="aviso" class="aviso" role="alert" hidden></p>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-container">

            <a href="index.html" class="logo footer-logo">
                <span class="logo-mark" aria-hidden="true">CJ</span>
                <span>Conecta <strong>Jovem</strong></span>
            </a>

            <p>Conectando jovens a oportunidades de estágio e aprendizagem.</p>

            <span class="footer-copy">© 2026 Conecta Jovem</span>

        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
