
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Conecta Jovem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">

            <a href="index.html" class="logo" aria-label="Conecta Jovem - Início">
                <span class="logo-mark" aria-hidden="true">CJ</span>
                <span>Conecta <strong>Jovem</strong></span>
            </a>

            <nav class="nav" aria-label="Navegação principal">
                <a href="index.html#inicio" class="nav-link">Início</a>
                <a href="index.html#vagas" class="nav-link">Vagas</a>
                <a href="index.html#sobre" class="nav-link">Sobre</a>
            </nav>

            <div class="header-actions">

                <button
                    class="theme-button"
                    type="button"
                    aria-label="Alternar tema"
                    title="Alternar tema">
                    🌓
                </button>

                <a href="login.html" class="login-button">Entrar</a>

            </div>
        </div>
    </header>

    <main class="auth-section">
        <form class="auth-form" aria-labelledby="cadastro-titulo">
            <h1 id="cadastro-titulo">Criar conta</h1>

            <p>Escolha o tipo de conta que deseja criar:</p>

            <div class="account-types">
                <a href="cadastro-jovem.html" class="account-button">
                    Cadastro para Jovem
                </a>

                <a href="cadastro-empresa.html" class="account-button">
                    Cadastro para Empresa
                </a>
            </div>

            <p>Já tem conta? <a href="login.html">Entrar</a></p>
        </form>
    </main>

    <footer class="footer">
        <div class="container footer-container">

            <a href="index.html" class="logo footer-logo">
                <span class="logo-mark" aria-hidden="true">CJ</span>
                <span>Conecta <strong>Jovem</strong></span>
            </a>

            <p>Conectando jovens a oportunidades de estágio e aprendizagem.</p>

            <span class="footer-copy">© 2026 Conecta Jovem</span>

        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
