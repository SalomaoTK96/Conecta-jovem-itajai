# Roda sozinho a cada pull request para a main e a cada push na main.
# Serve de trava: se algum passo falhar, o GitHub marca o pull request
# como reprovado e não deixa fazer o merge.

name: Verificacao

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # O npm ci dispara o prisma generate, que precisa desta variavel existir.
    # A URL abaixo e so para os comandos rodarem, nao conecta em banco nenhum.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Baixa o codigo
        uses: actions/checkout@v4

      - name: Prepara o Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci instala exatamente o que esta no package-lock.
      # Se alguem mexeu no package.json e esqueceu de atualizar o lock, quebra aqui.
      - name: Instala as dependencias
        working-directory: backend
        run: npm ci

      # Confere se o modelo de dados do Prisma esta valido.
      # A URL abaixo e so para o comando rodar, nao conecta em banco nenhum.
      - name: Confere o modelo de dados
        working-directory: backend
        run: npx prisma validate

      # Roda os testes unitários das regras de negócio. Se algum falhar, o
      # pull request fica reprovado e o merge é bloqueado (teste de regressão).
      - name: Roda os testes unitários com cobertura
        working-directory: backend
        run: npm run test:cobertura

      # Garante que nenhum segredo de verdade foi commitado por engano.
      - name: Garante que o .env nao foi versionado
        run: |
          if git ls-files --error-unmatch backend/.env > /dev/null 2>&1; then
            echo "O arquivo backend/.env foi commitado. Remova antes de seguir."
            exit 1
          fi
          echo "Nenhum .env versionado."

  # Testes de integração: sobem um PostgreSQL de verdade só para o teste,
  # aplicam as migrações e chamam a API com o Supertest.
  integracao:
    name: Integracao (API e banco)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: conecta_jovem_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/conecta_jovem_teste?schema=public
      DATABASE_URL_TESTE: postgresql://ci:ci@localhost:5432/conecta_jovem_teste?schema=public
      JWT_SECRET: segredo-so-para-o-ci-com-mais-de-32-caracteres

    steps:
      - name: Baixa o codigo
        uses: actions/checkout@v4

      - name: Prepara o Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instala as dependencias
        working-directory: backend
        run: npm ci

      # Aplica as migrações na ordem, com o psql que já vem na máquina do GitHub.
      - name: Cria as tabelas no banco de teste
        working-directory: backend
        env:
          PGPASSWORD: ci
        run: |
          for arquivo in prisma/migrations/*/migration.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U ci -d conecta_jovem_teste -f "$arquivo"
          done

      - name: Roda os testes de integracao
        working-directory: backend
        run: npm run test:integracao
